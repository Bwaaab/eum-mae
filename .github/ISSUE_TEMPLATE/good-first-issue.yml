name: good first issue
description: 11주차 타 팀이 처음 기여할 수 있는 작업을 남길 때 사용합니다.
title: "[good first issue]: "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: 할 일
      description: 타 팀이 무엇을 고치거나 추가하면 되는지 적습니다.
      placeholder: …
    validations:
      required: true

  - type: textarea
    id: hint
    attributes:
      label: 시작 위치
      description: 볼 파일이나 확인 방법을 적습니다.
      placeholder: |
        관련 파일:

        확인 방법:
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 어떻게 되면 끝난 것인지 적습니다.
      placeholder: …
    validations:
      required: true
