# 이슈 제목 접두사에 맞춰 라벨을 만들고 붙인다.
# 템플릿의 labels 필드가, 저장소에 라벨이 없을 때 빠지는 경우를 보완한다.

name: Issue labels

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label from title
        uses: actions/github-script@v7
        with:
          script: |
            const presets = {
              '[bug]': { name: 'bug', color: 'd73a4a', description: '프로그램 실행 오류 및 예외 상황 수정' },
              '[enhancement]': { name: 'enhancement', color: '0e8a16', description: '새 기능 개발 및 UI/UX 개선' },
              '[documentation]': { name: 'documentation', color: '0075ca', description: '회의록, 안내서, README 등 문서화 작업' },
              '[question]': { name: 'question', color: 'd876e3', description: '기술적 문제 및 팀원·교수님 질의' },
              '[good first issue]': { name: 'good first issue', color: '7057ff', description: '11주차 타 팀 기여용' },
            }

            const title = context.payload.issue.title || ''
            const preset = Object.entries(presets).find(([prefix]) =>
              title.startsWith(prefix)
            )
            if (!preset) return

            const { name, color, description } = preset[1]
            const { owner, repo } = context.repo

            try {
              await github.rest.issues.getLabel({ owner, repo, name })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.issues.createLabel({
                owner,
                repo,
                name,
                color,
                description,
              })
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.issue.number,
              labels: [name],
            })
